<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>MoQ Live Stream</title>
	<style>
		:root { color-scheme: dark; --bg: #0b0d10; --panel: #15181d; --line: #2a2f37; --text: #e6e8eb; --muted: #8a919c; --live: #e5484d; }
		* { box-sizing: border-box; }
		body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; }
		main { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }
		header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
		h1 { font-size: 20px; margin: 0; }
		.badge { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 4px; background: var(--line); color: var(--muted); }
		.badge.live { background: var(--live); color: #fff; }
		.badge.quic { background: #1f6f3f; color: #fff; }
		.badge.ws { background: #8a5a00; color: #fff; }
		.player { background: #000; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; aspect-ratio: 16 / 9; }
		moq-watch-ui, moq-watch, canvas { display: block; width: 100%; height: 100%; }
		form { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; padding: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
		label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); flex: 1 1 240px; }
		input { font: 13px ui-monospace, monospace; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; }
		button { align-self: flex-end; font: inherit; padding: 6px 16px; border: 0; border-radius: 4px; background: #3b82f6; color: #fff; cursor: pointer; }
		#stats { margin-top: 12px; font: 12px ui-monospace, monospace; color: var(--muted); }
		#qoe { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; margin-top: 12px; }
		#qoe section { padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
		#qoe h2 { margin: 0 0 6px; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
		#qoe dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font: 12px/1.6 ui-monospace, monospace; }
		#qoe dt { color: var(--muted); }
		#qoe dd { margin: 0; text-align: right; }
		#qoe dd.bad { color: var(--live); }
		#qoe dd.na { color: var(--line); }
	</style>
</head>
<body>
	<main>
		<!-- Only shows up when the browser lacks WebTransport/WebCodecs. -->
		<moq-watch-support show="warning"></moq-watch-support>

		<header>
			<h1>MoQ Live Stream</h1>
			<span id="status" class="badge">Connecting</span>
			<span id="transport" class="badge" title="Wire transport of the relay connection">no connection</span>
		</header>

		<div class="player">
			<moq-watch-ui>
				<moq-watch id="watch">
					<canvas></canvas>
				</moq-watch>
			</moq-watch-ui>
		</div>

		<div id="stats"></div>

		<!-- QoE panel, sampled once a second from the element's signals (see main.js). -->
		<div id="qoe">
			<section>
				<h2>Playback</h2>
				<dl>
					<dt>fps</dt><dd data-stat="fps"></dd>
					<dt>frames</dt><dd data-stat="frames"></dd>
					<dt>display</dt><dd data-stat="display"></dd>
					<dt>frozen</dt><dd data-stat="frozen"></dd>
				</dl>
			</section>
			<section>
				<h2>Stalls</h2>
				<dl>
					<dt>video</dt><dd data-stat="videoStalls"></dd>
					<dt>audio</dt><dd data-stat="audioStalls"></dd>
					<dt>skipped groups</dt><dd data-stat="skipped"></dd>
					<dt>last skip</dt><dd data-stat="lastSkip"></dd>
				</dl>
			</section>
			<section>
				<h2>Latency</h2>
				<dl>
					<dt>delay</dt><dd data-stat="delay"></dd>
					<dt>jitter</dt><dd data-stat="jitter"></dd>
					<dt>rtt</dt><dd data-stat="rtt"></dd>
					<dt>buffered</dt><dd data-stat="buffered"></dd>
				</dl>
			</section>
			<section>
				<h2>Network</h2>
				<dl>
					<dt>video</dt><dd data-stat="videoRate"></dd>
					<dt>audio</dt><dd data-stat="audioRate"></dd>
					<dt>loss</dt><dd data-stat="loss"></dd>
					<dt>total</dt><dd data-stat="total"></dd>
				</dl>
			</section>
		</div>

		<form id="source">
			<label>Relay URL <input name="url" required></label>
			<label>Broadcast <input name="name" required></label>
			<button>Watch</button>
		</form>
	</main>
	<script type="module" src="/main.js"></script>
</body>
</html>
